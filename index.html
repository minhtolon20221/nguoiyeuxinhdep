<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phong Bì & Lá Thư TikTok Trend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* KHUNG CHÍNH CĂN GIỮA MÀN HÌNH */
        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* VỎ PHONG BÌ */
        .envelope-box {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #fce4ec;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.2);
            cursor: pointer;
        }

        /* LỚP 1: MẶT SAU TRONG LÒNG PHONG BÌ */
        .envelope-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #f8bbd0;
            border-radius: 12px;
            z-index: 1;
        }

        /* LỚP 2: LÁ THƯ (MẶC ĐỊNH NẰM TRONG PHONG BÌ) */
        .letter {
            position: absolute;
            bottom: 8px;
            left: 15px;
            width: 270px;
            height: 180px;
            background: #fffdf5;
            background-image: linear-gradient(#e8e0d0 1px, transparent 1px);
            background-size: 100% 24px;
            border-radius: 10px;
            padding: 16px;
            border: 1px solid #e0d5c1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            z-index: 2;
            transform: translateY(0) scale(1);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s ease;
            box-sizing: border-box;
            overflow: hidden;
        }

        .letter-stamp {
            position: absolute;
            top: 10px; right: 12px;
            width: 28px; height: 28px;
            background: radial-gradient(circle, #d32f2f, #8e0000);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 12px;
        }

        .letter-content {
            font-family: 'Comic Sans MS', 'Dancing Script', cursive;
            color: #2b1704;
            opacity: 0;
            transition: opacity 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .letter-content h3 {
            font-size: 1.2rem;
            color: #b71c1c;
            margin-bottom: 4px;
        }

        .typed-text {
            font-size: 0.95rem;
            line-height: 1.4;
            white-space: pre-line;
            min-height: 85px;
        }

        .signature {
            text-align: right;
            font-weight: bold;
            font-size: 1rem;
            color: #8e0000;
        }

        .btn-pack {
            background: #d81b60;
            color: #fff;
            border: none;
            padding: 5px 14px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            font-family: sans-serif;
            margin: 4px auto 0 auto;
            display: block;
            box-shadow: 0 3px 8px rgba(216, 27, 96, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-pack:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        /* LỚP 3: TÚI MẶT TRƯỚC PHONG BÌ */
        .envelope-pocket {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        .envelope-pocket::before {
            content: ''; position: absolute; top: 0; left: 0;
            border-left: 150px solid #f48fb1;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-bottom-left-radius: 12px;
        }

        .envelope-pocket::after {
            content: ''; position: absolute; top: 0; right: 0;
            border-right: 150px solid #f06292;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-bottom-right-radius: 12px;
        }

        .envelope-bottom {
            position: absolute;
            bottom: 0; left: 0;
            border-bottom: 105px solid #ec407a;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            z-index: 5;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            pointer-events: none;
        }

        /* LỚP 4: NẮP PHONG BÌ */
        .envelope-flap {
            position: absolute;
            top: 0; left: 0;
            border-top: 115px solid #d81b60;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            transform-origin: top;
            transition: transform 0.4s ease-in-out;
            z-index: 6;
        }

        .wax-seal {
            position: absolute;
            top: 75px; left: 50%;
            transform: translateX(-50%);
            width: 44px; height: 44px;
            background: radial-gradient(circle, #ff1744, #880e4f);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 7;
            transition: opacity 0.2s ease;
        }

        .click-hint {
            margin-top: 35px;
            color: #d81b60;
            font-weight: 600;
            font-size: 0.95rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-6px); opacity: 1; }
        }

        /* ----- TRẠNG THÁI HIỆU ỨNG (STATE MANAGEMENT) ----- */

        /* 1. Mở nắp */
        .flap-open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .flap-open .wax-seal {
            opacity: 0;
            pointer-events: none;
        }

        /* 2. Trượt thư lên khỏi miệng phong bì */
        .letter-slid-up .letter {
            transform: translateY(-165px) scale(1);
        }

        /* 3. Đưa z-index lá thư lên trên cùng */
        .letter-in-front .letter {
            z-index: 100 !important;
        }

        /* 4. TĂNG KÍCH THƯỚC LÁ THƯ LÊN RẤT TO KHI MỞ OUT */
        .letter-zoomed .letter {
            transform: translateY(-10px) scale(2.5); /* Tăng kích thước gấp 2.5 lần trên màn hình máy tính */
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }

        .letter-zoomed .letter-content {
            opacity: 1;
        }

        /* Tối ưu hóa cho màn hình điện thoại */
        @media (max-width: 600px) {
            .letter-zoomed .letter {
                transform: translateY(-10px) scale(1.65); /* Scale vừa vặn màn hình di động */
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="envelope-box" id="envelopeBox" onclick="openEnvelope()">
            <div class="envelope-back"></div>

            <div class="letter" id="letterCard" onclick="event.stopPropagation()">
                <div class="letter-stamp">❤️</div>
                <div class="letter-content">
                    <div>
                        <h3>Gửi [Tên Người Nhận],</h3>
                        <div class="typed-text" id="typedText"></div>
                    </div>

                    <div>
                        <div class="signature">Thân mến,<br>[Tên Của Bạn]</div>
                        <button class="btn-pack" onclick="closeEnvelope(event)">Gấp & nhét vào phong bì ✉️</button>
                    </div>
                </div>
            </div>

            <div class="envelope-pocket"></div>
            <div class="envelope-bottom"></div>
            <div class="envelope-flap"></div>
            <div class="wax-seal">❤️</div>
        </div>

        <div class="click-hint" id="clickHint">✨ Nhấp vào phong bì để mở thư ✨</div>
    </div>

    <script>
        const letterText = "Chào mừng bạn đã mở lá thư này!\n\nĐây là thông điệp được chuẩn bị riêng dành cho bạn.\n\nChúc bạn luôn có một ngày ngập tràn niềm vui và may mắn!";
        let typeIndex = 0;
        let typeTimer = null;
        let isAnimating = false;

        function typeWriter() {
            const container = document.getElementById('typedText');
            if (typeIndex < letterText.length) {
                container.textContent += letterText.charAt(typeIndex);
                typeIndex++;
                typeTimer = setTimeout(typeWriter, 35);
            }
        }

        function startTyping() {
            clearTimeout(typeTimer);
            document.getElementById('typedText').textContent = "";
            typeIndex = 0;
            typeWriter();
        }

        function openEnvelope() {
            if (isAnimating) return;
            const box = document.getElementById('envelopeBox');

            if (!box.classList.contains('flap-open')) {
                isAnimating = true;

                // BƯỚC 1: Lật mở nắp phong bì
                box.classList.add('flap-open');

                // BƯỚC 2: Rút lá thư trượt thẳng lên
                setTimeout(() => {
                    box.classList.add('letter-slid-up');

                    // BƯỚC 3: Đổi layer thư lên trên túi phong bì
                    setTimeout(() => {
                        box.classList.add('letter-in-front');

                        // BƯỚC 4: Phóng to lá thư ra giữa màn hình & chạy gõ chữ
                        setTimeout(() => {
                            box.classList.add('letter-zoomed');
                            startTyping();
                            isAnimating = false;
                        }, 50);

                    }, 450);

                }, 400);
            }
        }

        function closeEnvelope(e) {
            if (e) e.stopPropagation();
            if (isAnimating) return;

            isAnimating = true;
            const box = document.getElementById('envelopeBox');

            clearTimeout(typeTimer);
            document.getElementById('typedText').textContent = "";

            // BƯỚC 1: Thu nhỏ lá thư
            box.classList.remove('letter-zoomed');

            // BƯỚC 2: Đổi layer lá thư chui vào trong
            setTimeout(() => {
                box.classList.remove('letter-in-front');

                // BƯỚC 3: Trượt lá thư hạ xuống lòng túi phong bì
                setTimeout(() => {
                    box.classList.remove('letter-slid-up');

                    // BƯỚC 4: Gập nắp phong bì lại
                    setTimeout(() => {
                        box.classList.remove('flap-open');
                        isAnimating = false;
                    }, 450);

                }, 50);

            }, 450);
        }
    </script>
</body>
</html>
