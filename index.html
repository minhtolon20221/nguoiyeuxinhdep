<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phong Bì & Lá Thư - Sharp Text & Audio Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Khóa hoàn toàn thanh cuộn */
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* NỀN MỜ KHI MỞ THƯ */
        .backdrop-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(5px);
            z-index: 80;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .backdrop-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* PHONG BÌ */
        .envelope-box {
            position: relative;
            width: 360px;
            height: 240px;
            background-color: #fce4ec;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            box-shadow: 0 18px 40px rgba(216, 27, 96, 0.22);
            cursor: pointer;
        }

        .envelope-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #f8bbd0;
            border-radius: 14px;
            z-index: 1;
        }

        /* LÁ THƯ THIẾT KẾ KÍCH THƯỚC THẬT CỰC NÉT (600px x 400px) */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 600px;
            height: 400px;
            margin-left: -300px; /* Căn giữa */
            background: #fffdf5;
            background-image: linear-gradient(#e8e0d0 1px, transparent 1px);
            background-size: 100% 32px;
            border-radius: 14px;
            padding: 30px;
            border: 1px solid #e0d5c1;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            z-index: 2;
            
            /* Ban đầu thu nhỏ 0.53 lần để nhét vừa phong bì */
            transform: translateY(0) scale(0.53);
            transform-origin: bottom center;
            transition: transform 0.5s cubic-bezier(0.34, 1.15, 0.64, 1), box-shadow 0.5s ease;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* NÚT ĐÓNG (X) GÓC TRÊN LÁ THƯ */
        .close-btn-x {
            position: absolute;
            top: 14px;
            right: 18px;
            width: 32px;
            height: 32px;
            background: rgba(216, 27, 96, 0.12);
            color: #d81b60;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s, transform 0.2s;
        }

        .close-btn-x:hover {
            background: #d81b60;
            color: #fff;
            transform: scale(1.1);
        }

        .letter-stamp {
            position: absolute;
            top: 16px; right: 65px;
            width: 36px; height: 36px;
            background: radial-gradient(circle, #d32f2f, #8e0000);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 14px;
        }

        .letter-content {
            font-family: 'Dancing Script', cursive;
            color: #2b1704;
            opacity: 0;
            transition: opacity 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .letter-content h3 {
            font-size: 2rem;
            color: #b71c1c;
            margin-bottom: 10px;
        }

        .typed-text {
            font-size: 1.45rem;
            line-height: 1.6;
            white-space: pre-line;
            min-height: 180px;
        }

        .signature {
            text-align: right;
            font-weight: 700;
            font-size: 1.4rem;
            color: #8e0000;
        }

        .btn-pack {
            background: #d81b60;
            color: #fff;
            border: none;
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin: 8px auto 0 auto;
            display: block;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-pack:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        /* TÚI MẶT TRƯỚC PHONG BÌ */
        .envelope-pocket {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        .envelope-pocket::before {
            content: ''; position: absolute; top: 0; left: 0;
            border-left: 180px solid #f48fb1;
            border-top: 120px solid transparent;
            border-bottom: 120px solid transparent;
            border-bottom-left-radius: 14px;
        }

        .envelope-pocket::after {
            content: ''; position: absolute; top: 0; right: 0;
            border-right: 180px solid #f06292;
            border-top: 120px solid transparent;
            border-bottom: 120px solid transparent;
            border-bottom-right-radius: 14px;
        }

        .envelope-bottom {
            position: absolute;
            bottom: 0; left: 0;
            border-bottom: 125px solid #ec407a;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            z-index: 5;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            pointer-events: none;
        }

        /* NẮP PHONG BÌ */
        .envelope-flap {
            position: absolute;
            top: 0; left: 0;
            border-top: 135px solid #d81b60;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            transform-origin: top;
            transition: transform 0.4s ease-in-out;
            z-index: 6;
        }

        .wax-seal {
            position: absolute;
            top: 88px; left: 50%;
            transform: translateX(-50%);
            width: 46px; height: 46px;
            background: radial-gradient(circle, #ff1744, #880e4f);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 7;
            transition: opacity 0.2s ease;
        }

        .click-hint {
            margin-top: 35px;
            color: #d81b60;
            font-weight: 600;
            font-size: 1rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-6px); opacity: 1; }
        }

        /* NÚT ĐIỀU KHIỂN NHẠC */
        .music-control {
            position: fixed;
            bottom: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255,255,255,0.8);
            padding: 10px 20px; border-radius: 30px;
            cursor: pointer; font-size: 0.9rem; font-weight: 600; color: #333;
            z-index: 200; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }

        .music-control:hover {
            transform: scale(1.05);
        }

        /* ----- TRẠNG THÁI HIỆU ỨNG (ANIMATION STATES) ----- */

        .flap-open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .flap-open .wax-seal {
            opacity: 0;
            pointer-events: none;
        }

        .letter-slid-up .letter {
            transform: translateY(-220px) scale(0.53);
        }

        .letter-in-front .letter {
            z-index: 100 !important;
        }

        /* MỞ THƯ RA NATIVE KÍCH THƯỚC CHUẨN 100% (SẮC NÉT HOÀN HẢO) */
        .letter-zoomed .letter {
            transform: translateY(-40px) scale(1); 
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
        }

        .letter-zoomed .letter-content {
            opacity: 1;
        }

        /* ĐIỆN THOẠI: THU NHỎ TỶ LỆ TRÊN MÀN HÌNH NHỎ */
        @media (max-width: 650px) {
            .letter {
                width: 520px;
                height: 360px;
                margin-left: -260px;
                padding: 22px;
            }
            .letter-content h3 { font-size: 1.6rem; }
            .typed-text { font-size: 1.2rem; min-height: 150px; }
            .letter-zoomed .letter {
                transform: translateY(-20px) scale(0.68);
            }
        }
    </style>
</head>
<body>

    <div class="backdrop-overlay" id="backdropOverlay" onclick="closeEnvelope(event)"></div>

    <button class="music-control" onclick="toggleMusic()">
        <span id="musicIcon">🎵</span> <span id="musicText">Bật nhạc My Love Mine All Mine</span>
    </button>

    <audio id="bgMusic" preload="auto" loop>
        <source src="https://files.catbox.moe/8m9r1n.mp3" type="audio/mpeg">
        <source src="https://ia801503.us.archive.org/15/items/mitski-my-love-mine-all-mine/Mitski%20-%20My%20Love%20Mine%20All%20Mine.mp3" type="audio/mpeg">
    </audio>

    <div class="main-wrapper">
        <div class="envelope-box" id="envelopeBox" onclick="openEnvelope()">
            <div class="envelope-back"></div>

            <div class="letter" id="letterCard" onclick="event.stopPropagation()">
                <button class="close-btn-x" onclick="closeEnvelope(event)" title="Đóng thư">✕</button>
                <div class="letter-stamp">❤️</div>
                
                <div class="letter-content">
                    <div>
                        <h3>Gửi [Tên Người Nhận],</h3>
                        <div class="typed-text" id="typedText"></div>
                    </div>

                    <div>
                        <div class="signature">Thân mến,<br>[Tên Của Bạn]</div>
                        <button class="btn-pack" onclick="closeEnvelope(event)">Gấp & nhét vào phong bì ✉️</button>
                    </div>
                </div>
            </div>

            <div class="envelope-pocket"></div>
            <div class="envelope-bottom"></div>
            <div class="envelope-flap"></div>
            <div class="wax-seal">❤️</div>
        </div>

        <div class="click-hint" id="clickHint">✨ Nhấp vào phong bì để mở thư ✨</div>
    </div>

    <script>
        const letterText = "Chào mừng bạn đã mở lá thư này!\n\nNothing in the world belongs to me but my love, my love is mine all mine...\n\nChúc bạn có một ngày tràn ngập tình yêu và niềm vui nhé!";
        let typeIndex = 0;
        let typeTimer = null;
        let isAnimating = false;

        function typeWriter() {
            const container = document.getElementById('typedText');
            if (typeIndex < letterText.length) {
                container.textContent += letterText.charAt(typeIndex);
                typeIndex++;
                typeTimer = setTimeout(typeWriter, 35);
            }
        }

        function startTyping() {
            clearTimeout(typeTimer);
            document.getElementById('typedText').textContent = "";
            typeIndex = 0;
            typeWriter();
        }

        // MỞ THƯ
        function openEnvelope() {
            if (isAnimating) return;
            const box = document.getElementById('envelopeBox');
            const overlay = document.getElementById('backdropOverlay');

            if (!box.classList.contains('flap-open')) {
                isAnimating = true;

                // 1. Mở nắp phong bì
                box.classList.add('flap-open');

                // 2. Rút lá thư trượt thẳng lên
                setTimeout(() => {
                    box.classList.add('letter-slid-up');

                    // 3. Đưa layer lá thư lên trước mặt phong bì
                    setTimeout(() => {
                        box.classList.add('letter-in-front');

                        // 4. Phóng to lá thư sắc nét & mở nền mờ + gõ chữ
                        setTimeout(() => {
                            box.classList.add('letter-zoomed');
                            overlay.classList.add('active');
                            startTyping();
                            playMusicAuto();
                            isAnimating = false;
                        }, 50);

                    }, 450);

                }, 400);
            }
        }

        // ĐÓNG THƯ
        function closeEnvelope(e) {
            if (e) e.stopPropagation();
            if (isAnimating) return;

            isAnimating = true;
            const box = document.getElementById('envelopeBox');
            const overlay = document.getElementById('backdropOverlay');

            clearTimeout(typeTimer);
            document.getElementById('typedText').textContent = "";
            overlay.classList.remove('active');

            box.classList.remove('letter-zoomed');

            setTimeout(() => {
                box.classList.remove('letter-in-front');

                setTimeout(() => {
                    box.classList.remove('letter-slid-up');

                    setTimeout(() => {
                        box.classList.remove('flap-open');
                        isAnimating = false;
                    }, 450);

                }, 50);

            }, 450);
        }

        // XỬ LÝ ÂM THANH
        const bgMusic = document.getElementById('bgMusic');
        let musicPlaying = false;

        function playChorus() {
            bgMusic.currentTime = 38; // Nhảy đến điệp khúc (0:38)
            const playPromise = bgMusic.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    document.getElementById('musicIcon').textContent = '🎶';
                    document.getElementById('musicText').textContent = 'Đang phát: My Love Mine All Mine';
                    musicPlaying = true;
                }).catch(error => {
                    console.log("Lỗi phát âm thanh:", error);
                    document.getElementById('musicText').textContent = 'Nhấp vào đây để bật nhạc 🎵';
                });
            }
        }

        function toggleMusic() {
            if (musicPlaying) {
                bgMusic.pause();
                document.getElementById('musicIcon').textContent = '🎵';
                document.getElementById('musicText').textContent = 'Bật nhạc My Love Mine All Mine';
                musicPlaying = false;
            } else {
                playChorus();
            }
        }

        function playMusicAuto() {
            if (!musicPlaying) {
                playChorus();
            }
        }
    </script>
</body>
</html>
