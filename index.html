<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phong Bì & Lá Thư - HD Sharp & Audio Fade-In</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* NỀN TỐI CHE TOÀN MÀN HÌNH KHI MỞ THƯ */
        .backdrop-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            z-index: 80;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .backdrop-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* KHUNG CHÍNH PHONG BÌ */
        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* PHONG BÌ */
        .envelope-box {
            position: relative;
            width: 360px;
            height: 240px;
            background-color: #fce4ec;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .envelope-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #f8bbd0;
            border-radius: 14px;
            z-index: 1;
        }

        /* LÁ THƯ TĂNG KÍCH THƯỚC LỚN (760px x 480px) & NÉT 100% */
        .letter {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 760px;
            height: 480px;
            margin-left: -380px;
            background: #fffdf5;
            background-image: linear-gradient(#e8e0d0 1px, transparent 1px);
            background-size: 100% 34px;
            border-radius: 14px;
            padding: 32px 36px;
            border: 1px solid #e0d5c1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            z-index: 2;
            
            /* Ban đầu thu nhỏ bằng scale(0.42) để nhét vừa phong bì */
            transform: translateY(0) scale(0.42);
            transform-origin: bottom center;
            /* Transition mượt mà 0.6 giây */
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.6s ease;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* NÚT ĐÓNG X GÓC THƯ */
        .close-btn-x {
            position: absolute;
            top: 14px;
            right: 18px;
            width: 36px;
            height: 36px;
            background: rgba(216, 27, 96, 0.12);
            color: #d81b60;
            border: none;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s, transform 0.2s;
        }

        .close-btn-x:hover {
            background: #d81b60;
            color: #fff;
            transform: scale(1.1);
        }

        .letter-stamp {
            position: absolute;
            top: 16px; right: 65px;
            width: 36px; height: 36px;
            background: radial-gradient(circle, #d32f2f, #8e0000);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 14px;
        }

        .letter-content {
            font-family: 'Dancing Script', cursive;
            color: #2b1704;
            opacity: 0;
            transition: opacity 0.4s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .letter-content h3 {
            font-size: 2.2rem;
            color: #b71c1c;
            margin-bottom: 10px;
        }

        .typed-text {
            font-size: 1.6rem;
            line-height: 1.6;
            white-space: pre-line;
            min-height: 220px;
            font-weight: 600;
        }

        .signature {
            text-align: right;
            font-weight: 700;
            font-size: 1.6rem;
            color: #8e0000;
        }

        .btn-pack {
            background: #d81b60;
            color: #fff;
            border: none;
            padding: 10px 26px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin: 6px auto 0 auto;
            display: block;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-pack:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        /* TÚI MẶT TRƯỚC PHONG BÌ */
        .envelope-pocket {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        .envelope-pocket::before {
            content: ''; position: absolute; top: 0; left: 0;
            border-left: 180px solid #f48fb1;
            border-top: 120px solid transparent;
            border-bottom: 120px solid transparent;
            border-bottom-left-radius: 14px;
        }

        .envelope-pocket::after {
            content: ''; position: absolute; top: 0; right: 0;
            border-right: 180px solid #f06292;
            border-top: 120px solid transparent;
            border-bottom: 120px solid transparent;
            border-bottom-right-radius: 14px;
        }

        .envelope-bottom {
            position: absolute;
            bottom: 0; left: 0;
            border-bottom: 125px solid #ec407a;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            z-index: 5;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            pointer-events: none;
        }

        /* NẮP PHONG BÌ */
        .envelope-flap {
            position: absolute;
            top: 0; left: 0;
            border-top: 135px solid #d81b60;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            transform-origin: top;
            transition: transform 0.4s ease-in-out;
            z-index: 6;
        }

        .wax-seal {
            position: absolute;
            top: 88px; left: 50%;
            transform: translateX(-50%);
            width: 46px; height: 46px;
            background: radial-gradient(circle, #ff1744, #880e4f);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 7;
            transition: opacity 0.2s ease;
        }

        .click-hint {
            margin-top: 35px;
            color: #d81b60;
            font-weight: 600;
            font-size: 1rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-6px); opacity: 1; }
        }

        /* NÚT BẬT NHẠC */
        .music-control {
            position: fixed;
            bottom: 20px; left: 20px;
            background: #fff;
            border: 2px solid #d81b60;
            padding: 10px 20px; border-radius: 30px;
            cursor: pointer; font-size: 0.9rem; font-weight: 600; color: #d81b60;
            z-index: 200; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex; align-items: center; gap: 8px;
            transition: transform 0.2s;
        }

        .music-control:hover {
            transform: scale(1.05);
        }

        /* ----- HIỆU ỨNG MỞ THƯ TRANSITION MƯỢT & SẮC NÉT ----- */

        .flap-open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .flap-open .wax-seal {
            opacity: 0;
        }

        /* Rút lá thư trượt nhô lên */
        .letter-slid-up .letter {
            transform: translateY(-210px) scale(0.42);
        }

        .letter-in-front .letter {
            z-index: 100 !important;
        }

        /* PHÓNG TO THƯ BUNG RỘNG CỰC SẮC NÉT (scale(1) CHUẨN ĐỘ PHÂN GIẢI GỐC) */
        .letter-zoomed .letter {
            transform: translateY(-270px) scale(1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        }

        .letter-zoomed .letter-content {
            opacity: 1;
        }

        /* ĐIỆN THOẠI & MÀN HÌNH NHỎ */
        @media (max-width: 800px) {
            .letter {
                width: 90vw;
                height: 460px;
                margin-left: -45vw;
                padding: 22px;
            }
            .typed-text { font-size: 1.3rem; min-height: 180px; }
            .letter-content h3 { font-size: 1.7rem; }
            .letter-zoomed .letter {
                transform: translateY(-160px) scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="backdrop-overlay" id="backdropOverlay" onclick="closeEnvelope(event)"></div>

    <button class="music-control" onclick="toggleMusic()">
        <span id="musicIcon">🎵</span> <span id="musicText">Bật Nhạc (My Love Mine All Mine)</span>
    </button>

    <audio id="bgMusic" preload="auto" loop src="https://ia801503.us.archive.org/15/items/mitski-my-love-mine-all-mine/Mitski%20-%20My%20Love%20Mine%20All%20Mine.mp3"></audio>

    <div class="main-wrapper">
        <div class="envelope-box" id="envelopeBox" onclick="openEnvelope()">
            <div class="envelope-back"></div>

            <div class="letter" id="letterCard" onclick="event.stopPropagation()">
                <button class="close-btn-x" onclick="closeEnvelope(event)" title="Đóng thư">✕</button>
                <div class="letter-stamp">❤️</div>
                
                <div class="letter-content">
                    <div>
                        <h3>Gửi [Tên Người Nhận],</h3>
                        <div class="typed-text" id="typedText"></div>
                    </div>

                    <div>
                        <div class="signature">Thân mến,<br>[Tên Của Bạn]</div>
                        <button class="btn-pack" onclick="closeEnvelope(event)">Gấp & nhét vào phong bì ✉️</button>
                    </div>
                </div>
            </div>

            <div class="envelope-pocket"></div>
            <div class="envelope-bottom"></div>
            <div class="envelope-flap"></div>
            <div class="wax-seal">❤️</div>
        </div>

        <div class="click-hint" id="clickHint">✨ Nhấp vào phong bì để mở thư ✨</div>
    </div>

    <script>
        const letterText = "Chào mừng bạn đã mở lá thư này!\n\nNothing in the world belongs to me but my love, my love is mine all mine...\n\nChúc bạn có một ngày tràn ngập tình yêu và niềm vui nhé!";
        let typeIndex = 0;
        let typeTimer = null;
        let isAnimating = false;
        const bgMusic = document.getElementById('bgMusic');
        let musicPlaying = false;
        let fadeInterval = null;

        function typeWriter() {
            const container = document.getElementById('typedText');
            if (typeIndex < letterText.length) {
                container.textContent += letterText.charAt(typeIndex);
                typeIndex++;
                typeTimer = setTimeout(typeWriter, 35);
            }
        }

        function startTyping() {
            clearTimeout(typeTimer);
            document.getElementById('typedText').textContent = "";
            typeIndex = 0;
            typeWriter();
        }

        // BẮT ĐẦU VÀO NHẠC VỚI HIỆU ỨNG TĂNG ÂM LƯỢNG TỪ TỪ (VOLUME FADE-IN TRANSITION)
        function playPreChorusMusic() {
            if (!musicPlaying) {
                clearInterval(fadeInterval);
                bgMusic.volume = 0; // Âm lượng bắt đầu từ 0
                bgMusic.currentTime = 18; // Nhảy đến đoạn 0:18 trước điệp khúc
                
                bgMusic.play().then(() => {
                    musicPlaying = true;
                    document.getElementById('musicIcon').textContent = '🎶';
                    document.getElementById('musicText').textContent = 'Đang phát: My Love Mine All Mine';

                    // Tăng dần âm lượng từ 0 lên 100% trong vòng 1.5 giây
                    let vol = 0;
                    fadeInterval = setInterval(() => {
                        if (vol < 1) {
                            vol += 0.05;
                            if (vol > 1) vol = 1;
                            bgMusic.volume = vol;
                        } else {
                            clearInterval(fadeInterval);
                        }
                    }, 75);

                }).catch((err) => {
                    console.log("Cần tương tác mở thư để phát nhạc:", err);
                });
            }
        }

        // MỞ THƯ
        function openEnvelope() {
            playPreChorusMusic(); // Phát nhạc kèm fade-in khi bấm mở

            if (isAnimating) return;
            const box = document.getElementById('envelopeBox');
            const overlay = document.getElementById('backdropOverlay');

            if (!box.classList.contains('flap-open')) {
                isAnimating = true;

                // 1. Mở nắp phong bì
                box.classList.add('flap-open');

                // 2. Rút lá thư trượt nhô lên
                setTimeout(() => {
                    box.classList.add('letter-slid-up');

                    // 3. Đưa layer lá thư lên trên mặt phong bì
                    setTimeout(() => {
                        box.classList.add('letter-in-front');

                        // 4. Phóng to bức thư to rộng mượt mà & gõ chữ
                        setTimeout(() => {
                            box.classList.add('letter-zoomed');
                            overlay.classList.add('active');
                            startTyping();
                            isAnimating = false;
                        }, 50);

                    }, 450);

                }, 400);
            }
        }

        // ĐÓNG THƯ
        function closeEnvelope(e) {
            if (e) e.stopPropagation();
            if (isAnimating) return;

            isAnimating = true;
            const box = document.getElementById('envelopeBox');
            const overlay = document.getElementById('backdropOverlay');

            clearTimeout(typeTimer);
            document.getElementById('typedText').textContent = "";
            overlay.classList.remove('active');

            box.classList.remove('letter-zoomed');

            setTimeout(() => {
                box.classList.remove('letter-in-front');

                setTimeout(() => {
                    box.classList.remove('letter-slid-up');

                    setTimeout(() => {
                        box.classList.remove('flap-open');
                        isAnimating = false;
                    }, 450);

                }, 50);

            }, 550);
        }

        // NÚT ĐIỀU KHIỂN NHẠC THỦ CÔNG
        function toggleMusic() {
            if (musicPlaying) {
                bgMusic.pause();
                document.getElementById('musicIcon').textContent = '🎵';
                document.getElementById('musicText').textContent = 'Bật Nhạc (My Love Mine All Mine)';
                musicPlaying = false;
            } else {
                playPreChorusMusic();
            }
        }
    </script>
</body>
</html>
