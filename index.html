<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Trend - Envelope & Letter Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #ffdee9 0%, #b5fffc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ----- TRÁI TIM BAY NỀN (AESTHETIC FLOATING HEARTS) ----- */
        .heart-particle {
            position: fixed;
            color: rgba(255, 105, 180, 0.6);
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* ----- KHUNG PHONG BÌ CĂN GIỮA MÀN HÌNH ----- */
        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .envelope-box {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #fce4ec;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            box-shadow: 0 15px 35px rgba(216, 27, 96, 0.2);
            cursor: pointer;
            perspective: 1000px;
        }

        /* Nền phía sau trong lòng phong bì */
        .envelope-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #f8bbd0;
            border-radius: 12px;
            z-index: 1;
        }

        /* ----- TỜ THƯ NẰM TRONG PHONG BÌ ----- */
        .letter {
            position: absolute;
            bottom: 8px;
            left: 15px;
            width: 270px;
            height: 180px;
            background: #fffdf5;
            background-image: linear-gradient(#e8e0d0 1px, transparent 1px);
            background-size: 100% 26px;
            border-radius: 10px;
            padding: 20px 18px;
            border: 1px solid #e0d5c1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            z-index: 2; /* Nằm giữa mặt sau và nắp túi front */
            transform: translateY(0) scale(1);
            transform-origin: center center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.6s ease;
            box-sizing: border-box;
            overflow: hidden;
        }

        .letter-stamp {
            position: absolute;
            top: 12px; right: 15px;
            width: 30px; height: 30px;
            background: radial-gradient(circle, #d32f2f, #8e0000);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .letter-content {
            font-family: 'Dancing Script', cursive;
            color: #2b1704;
            opacity: 0;
            transition: opacity 0.4s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .letter-content h3 {
            font-size: 1.4rem;
            color: #b71c1c;
            margin-bottom: 6px;
        }

        .typed-text {
            font-size: 1.1rem;
            line-height: 1.45;
            white-space: pre-line;
            min-height: 110px;
        }

        .letter-content .signature {
            text-align: right;
            font-weight: 700;
            font-size: 1.15rem;
            color: #8e0000;
        }

        .btn-pack {
            background: #d81b60;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            margin: 8px auto 0 auto;
            display: block;
            box-shadow: 0 3px 8px rgba(216, 27, 96, 0.3);
            transition: transform 0.2s, background 0.2s;
        }

        .btn-pack:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        /* ----- TÚI MẶT TRƯỚC CỦA PHONG BÌ ----- */
        .envelope-pocket {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .envelope-pocket::before {
            content: ''; position: absolute; top: 0; left: 0;
            border-left: 150px solid #f48fb1;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-bottom-left-radius: 12px;
        }

        .envelope-pocket::after {
            content: ''; position: absolute; top: 0; right: 0;
            border-right: 150px solid #f06292;
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-bottom-right-radius: 12px;
        }

        .envelope-bottom {
            position: absolute;
            bottom: 0; left: 0;
            border-bottom: 105px solid #ec407a;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            z-index: 4;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            pointer-events: none;
        }

        /* NẮP PHONG BÌ 3D */
        .envelope-flap {
            position: absolute;
            top: 0; left: 0;
            border-top: 115px solid #d81b60;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            transform-origin: top;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s 0.25s;
            z-index: 5;
        }

        .wax-seal {
            position: absolute;
            top: 75px; left: 50%;
            transform: translateX(-50%);
            width: 46px; height: 46px;
            background: radial-gradient(circle, #ff1744, #880e4f);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 6;
            transition: opacity 0.3s ease;
        }

        .click-hint {
            margin-top: 35px;
            color: #d81b60;
            font-weight: 600;
            font-size: 0.95rem;
            animation: pulse 1.5s infinite;
            transition: opacity 0.3s;
        }

        @keyframes pulse {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-6px); opacity: 1; }
        }

        /* NÚT BẬT NHẠC */
        .music-control {
            position: fixed;
            bottom: 20px; left: 20px;
            background: rgba(255, 25
